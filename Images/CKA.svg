<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Certified Kubernetes Administrator (CKA)">
  <defs>
    <linearGradient id="cka-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b78e7"/>
      <stop offset="1" stop-color="#244d9e"/>
    </linearGradient>
  </defs>
  <!-- hexagon badge -->
  <polygon points="120,10 199,55 199,145 120,190 41,145 41,55" fill="url(#cka-bg)"/>
  <polygon points="120,10 199,55 199,145 120,190 41,145 41,55" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
  <!-- Kubernetes helm wheel -->
  <g transform="translate(120,74)" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
    <circle r="30"/>
    <circle r="10" stroke-width="4"/>
    <g stroke-width="5">
      <line x1="0" y1="-30" x2="0" y2="-12"/>
      <line x1="28.5" y1="9.3" x2="11.4" y2="3.7"/>
      <line x1="-28.5" y1="9.3" x2="-11.4" y2="3.7"/>
      <line x1="17.6" y1="24.3" x2="7.1" y2="9.7"/>
      <line x1="-17.6" y1="24.3" x2="-7.1" y2="9.7"/>
    </g>
  </g>
  <!-- text -->
  <text x="120" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="2">CKA</text>
  <text x="120" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#244d9e" letter-spacing="0.4">Certified Kubernetes</text>
  <text x="120" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#244d9e" letter-spacing="0.4">Administrator</text>
</svg>
